; ============================================================================
; Outlast VR
; ============================================================================
; You do not need to edit this file. Everything worth changing is in the
; in-game menu: press INSERT while playing, and press "Save these settings"
; when you like what you see. That writes your choices back here.
;
; This file lives next to OLGame.exe. If it goes missing the mod does nothing
; at all, which is deliberate: the engine addresses below are what make it
; safe to run.
; ============================================================================

[General]

; 1 = write OutlastVR_Log.txt in %LOCALAPPDATA%\OutlastVR while you play (the file a bug report
; needs), and the probe CSVs a developer run asks for. 0 = NO logging at all: no file is created, no
; writer thread runs, and nothing is formatted or buffered. Turn it off when you are just playing;
; turn it back on before reporting a problem, because without it there is nothing to read.
Log=0

[Stage3]
; SAFETY GATES. The mod attaches to specific places in the game's code, and it
; refuses to attach unless the running game is the exact build these addresses
; were read from: the file name has to match, and so do the actual bytes at
; each address. If Outlast ever updates, the mod switches itself off instead of
; writing into the wrong place. Do not edit anything in this block.
Exe=OLGame.exe
CalcSceneViewRva=0x62A020
Prologue=488BC4555356574154415541564157488DA8D8FDFFFF4881EC580300
DrawRva=0x62FBC0
DrawSize=9764
GetViewPointRva=0x168E50
; These three give the second eye its own scene view state. They are DELIBERATELY 0.
; In this engine the post-process chain hangs off that object, so an eye built from a
; freshly allocated one renders without the night vision tint, without the colour
; grading and with its own exposure, and the two eyes visibly disagree. Measured live
; 2026-08-04. They were originally added to chase a mesh flicker, changed nothing, and
; that flicker was fixed later by OcclForce instead. Do not switch them back on.
AllocViewStateRva=0
SharedStateRva=0
StateCreatorRva=0
OcclRva=0x29AEF0
OcclPrologue=4055565741554156488D6C24C04881EC40010000488B05FD62C20148
PvsRva=0x8A7810
PvsPrologue=488BC44C894018488950104889480855535657415441554156415748

; Stereo mode. Leave this alone.
Mode=split

; 3D depth, the "Depth" slider in the menu. Higher gives a stronger 3D effect
; and makes the world feel slightly smaller.
HalfEyeUU=3.155

; How far the camera moves when you lean: the "Lean amount" slider. 1.00 moves
; the camera exactly as far as you move, which is also the steadiest setting.
; Lower is subtler, higher is exaggerated (0.5 - 2.0).
LeanGain=1.000

; Legacy scale key, no longer used by the lean (it runs at the game's measured
; 100 units per metre). Left here so an older settings file still loads.
WorldToMeters=50.000

; Look around with your head. This is the whole point of the mod.
HeadTracking=1

; Leaning and ducking move the in-game camera. The camera only starts following
; your body once it knows where "sat still" is: recenter once you are settled,
; or just put the headset on and hold still for a second. Recenter again any
; time it feels off. 0 = the camera stays exactly where the game puts it.
HeadPosition=1

; Keep room-scale head movement attached to the character. Small natural leaning and
; crouching remain available, but physically walking away cannot leave the authored body.
BodyAnchor=1
BodySideM=0.12
BodyForwardM=0.10
BodyBackwardM=0.08
BodyUpM=0.18
BodyDownM=0.35
; The body comes with you : settle in a new spot (sit back, shift your chair) and the body
; slides back under you over a few seconds, instead of staying where you last recentered. 0 = off.
BodyFollow=1
; (Test44) With [Motion] RoomscaleWalk=1 the body does more than come with you: walk around your room and
; Miles walks the same steps in the game.

; Gameplay-only calibrated Outlast 1 upper-body IK. The tracked pose overrides ordinary native
; arm animation while native torso, legs, locomotion and finger curls remain active.
ArmDrive=1

; Test 33 arm-tracking corrections, all on by default in this test build. All three off is
; exactly the Test 16 arms. The menu's "Improved arm tracking" box switches all three together.
;   ArmHandSync - your hands are read at the same moment as the head pose the picture uses
;   ArmLeanFix  - your hands stay where your real hands are when you lean or duck
;   ArmSmoothDt - arm steadying feels the same at any frame rate (identical at 60 fps)
ArmHandSync=1
ArmLeanFix=1
ArmSmoothDt=1
SkelCtrlProbe=0
SkelPropProbe=0

; Tilting your head sideways tilts the picture. Off: the game keeps the horizon
; level and the two would fight each other.
HeadRoll=0

; Swap left and right eye. Only needed if the 3D looks inside out.
EyeSwap=1

; Cutscenes render wide so they surround you instead of playing in a small
; window. Switches on shortly after you start playing.
CineFov=1

; The camcorder's night vision light is aimed by your body, not your head, so
; turning your head used to leave the lit area behind. This aims it where you
; are actually looking.
NvLight=1

; Keeps solid objects from flickering in and out in 3D. The game decides what
; to draw using a test that assumes one picture per frame, and VR needs two.
; Turning this off brings the flickering back.
;  Since [Perf] OcclPerEye=1 fixes the cause instead - each eye
; gets its own answer, so the game's real occlusion culling is back - this key is
; only used when OcclPerEye=0. Leave it at 1: it is the fallback.
OcclForce=1

[Render]
;  World size: 1.00 = true size - the two eyes as far apart as yours (read from the headset).
; Things look too big or "zoomed in"? Lower it (0.90, 0.85...). Too small? Raise it. 0.60 - 1.50.
WorldSize=1.00
; HIGH-RESOLUTION RENDER: draw each eye independently of the desktop window size.
; Needs windowed mode (the launcher sets it). 0 = the old desktop-sized render.
HighResRender=1
; 1 = AUTO (default): use the OpenXR runtime's recommended size per eye. This includes
; runtime quality settings and is not necessarily the headset panel's physical resolution.
; 0 = MANUAL: use EyeWidth/EyeHeight below, ignoring RenderScale and runtime size updates.
; Change mode/dimensions in launcher > VR SETTINGS > PICTURE, then restart Outlast.
AutoEyeResolution=1
; AUTO only: 1.00 = recommended size, 0.80 = faster. VR menu slider applies live.
; Ships at 1.00 (the full recommended size); lower it if Outlast stutters.
RenderScale=1.00
; MANUAL per-eye render dimensions (also the startup fallback before AUTO gets its recommendation).
; Clamped to 480-4096 per axis, rounded down to multiples of 8. Both eyes use the same size.
; Example: 1440x1600 per eye produces a 2880x1600 side-by-side engine render.
; The OpenXR output still uses its recommended size; smaller renders are upscaled to it.
EyeWidth=1728
EyeHeight=1824
; LENS-SHAPED EYES (Test 36): each eye is drawn with the headset's own off-centre lens view
; (Quest 3: 54 degrees outward, 40 inward). Before, a centred camera had to reach the far edge of
; both eyes, so about a third of every picture was never seen and the rest was stretched ~1.24x.
; Same cost, sharper picture. 0 = the old centred render.
; (Test46e) 1 = on, but OFF by itself on Quest Link / Air Link (Meta's runtime), where it distorts the
; picture; 2 = on everywhere, Link included; 0 = off everywhere.
LensFit=1

; Desktop window size: 0 = match the desktop. These do not choose the per-eye
; render dimensions when HighResRender=1; use AUTO/MANUAL eye resolution above.
ResX=0
ResY=0

; Wider view: the render fills the headset's full width instead of stopping at 88 degrees.
; More world in the corners of your eyes, slightly softer picture. 1 = on, 0 = off.
WideFov=1

; Puts the game back into proper fullscreen if Windows drops it out, which it
; sometimes does when a headset connects. Without this the picture gets softer.
AutoFullscreen=0
HighResWindow=0

; Show one full-size eye on the desktop while the headset keeps true left/right stereo.
DesktopMirrorOneEye=1
; (Test46) How many frames a second your MONITOR shows while you play - the headset always gets every
; frame. Drawing every frame on the monitor too cost the game about a fifth of its speed. 0 = every frame.
DesktopMirrorFps=30
; (Test47) Outlast's film grain: 0 = off (a clean picture - in a headset the grain reads as blur), 1 = the
; game's own look. Also in the VR settings.
FilmGrain=0
; The camcorder's night vision on the flip screen: 1 = sharp (no smoothing), 0 = the old smoothed picture.
NightVisionSharp=1
; Suppress decorative lens flares (lamp halos, including flashlight flares).
; 0 = suppress, also when this key is absent. 1 = the game's flares; restart to apply.
LensFlares=0
; (Test46) With OcclForce=1 (below) the game's occlusion tests are answered "visible" without drawing
; them or waiting for the graphics card - the same picture, faster. 0 = the old way.
;  Only used when [Perf] OcclPerEye=0: with the per-eye path on, the test boxes
; ARE the answer and are always drawn.
OcclusionSkip=1

; Which stereo model builds the two eye images. 1 is the Mass Effect model and is
; what the mod ships with: focus distance costs no field of view at any setting,
; and Swap keeps the 3D correct while changing which distance sits flat.
; 0 is the original Outlast model, kept only as an escape hatch. It trims the
; edges off your view whenever focus distance moves, and its Swap inverts the 3D
; so near objects cannot be fused. There is no reason to choose it.
StereoModel=1

; Where things sit in depth, the "Focus distance" slider. Raise it a little if
; close objects look doubled or feel hard to look at.
;  0 by default: with the eyes as far apart as yours ([Render] WorldSize) the pictures need
; no shift at all - the true geometry. A tester found close things hard to look at with -0.05.
Convergence=0.000

; Settles small shakes while you hold still and gets out of the way as soon as
; you turn your head. Lower it if looking around feels slow to respond.
Smoothing=0.400

; Draws the game's own menus and readouts into both eyes. Without this each eye
; sees a different half of them.
UiMirror=1

; Procedural camcorder HUD: real recording time, zoom, spare count/capacity and charge.
; Replaces the old large battery gauge and hides only the original camcorder movie.
; The display spans most of the view like the game's own fullscreen overlay, sized from the headset's
; field of view and set back into it, so the readouts sit toward the corners as a display in front of
; you rather than a HUD pressed against the lenses.
; 0 restores the game's display. Legacy HUD fit keys are still read for this fallback.
CamcorderHud=1

; Shows narrow cameras on a flat screen instead of around you. Zero means off,
; which is what you want: everything stays in the world.
CinemaScreenBelowDeg=45.000

[Input]
; Touch controllers provide the game's virtual gamepad controls. The experimental
; hand-directed camera is disabled so the headset remains the only camera owner.
;  Valve Index: all four face buttons, both sticks, both grips and the triggers are
; bound, and a firm press on the LEFT trackpad is the pause menu / this settings menu - Valve's
; system button belongs to the runtime and never reaches an application.
MotionControls=1
HandCamcorder=0

; Gameplay: B sends left mouse down/up for Use; X crouches (also drops from ledges).
; Keep the game's mouse interaction bound to Left Mouse Button.
; Menus and left-grip shortcuts keep their original X/B bindings.
; 0 restores X=gamepad Use and B=crouch, with no synthetic mouse input.
;  Sprint no longer silences Use: running up to a door and pressing B opens it. The only
; grip that silences it is one the mod itself is holding (a handle, a ledge, a battery), because the
; hands-on door has already told the game to open.
MouseUse=1

; The game's own gamepad rumble, felt in both controllers. Strength 0.00 to 1.50.
Haptics=1
HapticStrength=1.000

; (Test48) Sticks that do not rest at zero (drift: the view turns or Miles walks by himself, seen on SteamVR
; controllers). StickAutoCenter=1: where the controller can tell your thumb is on the stick (Touch, Index, Vive),
; a stick that reads something with no thumb on it gives nothing until touched, and its resting point is taken
; off; a healthy stick is never changed. StickDeadzone 0.00 - 0.60, default 0.30 (0.00 = the game's own):
; anything under it is ignored, on each axis as well as overall, so a stick pushed forward that also reads a
; little to one side walks straight instead of veering. 0.30 suits most controllers; 0.60 is the most it can be.
;  A stick that is PUSHED always walks, whatever the touch sensor claims: a sensor that reports
; "no thumb" while the stick is held can no longer teach the drift fix that the pushed position is the rest
; point (that left the stick dead for the rest of the session on Valve Index controllers on a Pimax).
; The triggers (lean left / right) also ignore anything under 12% before they do anything.
StickAutoCenter=1
StickDeadzone=0.30

; What X interacts with: 0 = where Miles's body faces (the original game), 1 = where you look,
; 2 = where your right controller points.
LookToUse=1

; [AIMASSIST] How wide the interaction target is, in degrees. The game traces ONE ray along your
; gaze, so a handle or a narrow door edge a few degrees off-centre simply is not "looked at" and X
; does nothing. This bends that ray onto the nearest door knob that is ALREADY inside this cone, by
; at most AimAssistMaxDeg - a correction, never a replacement, so an object you are not looking at is
; still not picked and two close objects are still told apart by which one you look at.
; AimAssistConeDeg=0 turns it off (the exact single-ray behaviour). 4-8 suits most players.
; Ships at 6.0: the middle of that range - wide enough that a handle a few degrees off-centre
; still works, narrow enough that two close objects are still told apart by where you look.
AimAssistConeDeg=6.0
AimAssistMaxDeg=4.0

; Turning: 0 = smooth (hold the right stick), 1 = snap (flick it). SnapTurnDeg is the snap angle,
; SnapTurnBlink darkens the view for the moment the turn takes. (Test46) SmoothTurnDegPerSec is the smooth
; turn speed at full stick in degrees a second (30 - 260; 260 = the game's own fastest). (Test46d) Turning is
; the game's own stick turn (as in Test45), so Miles's body turns with the view and his arms stay right. SmoothTurnSpeed (0.20 - 1.00) is
; the old stick scale, kept for older settings files (1.000 = off).
TurnMode=0
SnapTurnDeg=45
SnapTurnBlink=0
SmoothTurnDegPerSec=180
SmoothTurnSpeed=1.000

; Which way the left stick walks: 0 = Miles's body (lets you run while looking back),
; 1 = where you look, 2 = where your left controller points.
WalkDirection=0

; 0 = the right stick only turns; your head does all the looking up and down, like a native VR
; game, and any tilt the game itself is left with is levelled out (Test 37 default).
; 1 = the right stick also tilts the view up and down (the original gamepad behaviour).
StickPitch=0

; Duck for real and Miles crouches; stand and he stands. CrouchDepthM is how far below your
; recenter height your head has to go (0.15 - 0.60). Needs HeadPosition=1.
PhysicalCrouch=0
CrouchDepthM=0.300

; Recenter the view. Use this whenever the world stops lining up with where you
; are actually sitting. Both of these can be changed from the in-game menu.
;
; Keyboard key, as a Windows key code. 71 is G, picked because Outlast itself
; already uses W A S D Q E F R J N Tab and Space.
RecenterKey=71

; Controller button, double tapped. 256 is L1, the left bumper. Double tapped
; rather than single so it cannot happen by accident mid-chase.
RecenterPad=256

; On the VR controllers the settings menu opens with: hold the left grip, press Menu.
; The key that opens the settings menu. 45 is INSERT. Change this if your
; keyboard does not have an INSERT key, or from inside the menu itself.
MenuKey=45

[Motion]
;   DocumentWristX/Y/Z     the document wrist, in degrees about the body own forward / right / up
;                          axes, at the wrist joint (tuned in the headset: 30 / 35 / 15). Any
;                          non-zero value replaces the automatic DocumentWristLift.
DocumentWristX=30
DocumentWristY=35
DocumentWristZ=15
; HANDS-ON CONTROLS (Test 37/38). All of these are also in the menu (HANDS > CAMCORDER and DOORS)
; and in the launcher (VR SETTINGS).
;   CamcorderHolster       the camcorder lives on your right hip: reach there and squeeze the grip,
;                          it glides into your hand (in Miles's own grip); bring it to your eye to
;                          look through it; let go and it goes back. 0 = raise-to-eye + grip toggle.
;   HowToHints             (Test 38) labels in the headset show what to do next (take the camcorder,
;                          pull out the battery...). Each stops after you have done it 3 times
;                          (Learned* below count that; set them to 0 to see the labels again).
;   DoorGrab               (Test 40) doors are heavy hinged bodies: push one with your open hand and it
;                          swings as far as you push (a shove swings it on a little, then it slows),
;                          or put a hand on the handle, squeeze grip and swing it; locked doors buzz.
;   CamcorderRaiseGesture  lift your right controller to your right eye and the camcorder comes up;
;                          take it away and it goes down. The right grip still toggles it too.
;   RaiseToEyeReachM       how close (metres) the controller has to come to the eye (0.05 - 0.25).
;                          Ships at 0.140 (14 cm); raise it if the camcorder will not come up.
;   CamcorderViewfinder    while you zoom (right stick up/down with the camcorder up) the zoomed
;                          picture shows in a viewfinder in front of your eyes, like the real thing.
;   DevMarkers             developer rings showing where each of these acts: door knobs (green,
;                          yellow = in reach, cyan = held, red = locked), the eye spot, the hip pouch.
;   QuestPrompts           the game's hints name the Quest 3 controls instead of Xbox buttons
;                          ("Grab the handle to open, or press X", "hold down the left grip").
DoorGrab=1
; (Test49) CamcorderControl: 0 = hands-on (default: the hip holster, raise it to your eye - the settings below).
; 1 = GRIP BUTTON: one squeeze of the right grip raises the camcorder, the next lowers it, and you look through
; it with your head - your hand can rest (seated play, arms that tire). The right grip then never grabs doors
; or edges. Switching back keeps your hands-on settings.
CamcorderControl=0
CamcorderHolster=1
CamcorderRaiseGesture=1
RaiseToEyeReachM=0.140
CamcorderViewfinder=1
DevMarkers=0
QuestPrompts=1
HowToHints=1
;  ClimbMode - how you climb:
;   0 = A BUTTON (default): the game's own climb, untouched - A climbs and vaults, the walk stick climbs a
;       ladder, its own arms throughout (the same as ClimbWithHands=0).
;   1 = HYBRID: PHYSICAL in every respect - the same hands, the same A, the same stick rules, the same
;       hand-off - with ONE difference: the walk stick's FORWARD still moves Miles during a climb, so a
;       player who reaches for the stick is never stuck. 
;   2 = PHYSICAL: only your hands, driving the game's own climb. A ladder is climbed rung by rung: squeeze a
;       rung and pull down (Miles climbs a rung), push up and he goes back down - going down, the game plays its
;       own descent animation with its own arm. The walk stick no longer climbs one for you - it walks you up to
;       it (so the game mounts it instead of you climbing it from far away), backs you DOWN it, and at its top it
;       finishes the step off onto the floor. A only jumps at a higher ledge and never finishes a climb: jump at
;       a platform taller than Miles and his LEFT hand catches it by itself, your right hand stays free. Squeeze
;       the left grip on that hand and it becomes yours, like the right one: pull either hand DOWN to climb up
;       (the game's climb animation, forward onto the platform) and push it UP to let go / go back; let the left
;       hand go and he drops unless the right hand still holds the ledge. The crouch button still drops you. Only
;       a platform higher than his head counts as a climb - a low one he jumps or vaults over, and that stays the
;       game's. Hanging from an edge the walk stick does nothing.
;       (A saved 1 from the older builds, the guided climb, reads as HYBRID.)
ClimbWithHands=0
ClimbMode=0
;  PHYSICAL climbing's number, in uu (1 uu = 1 cm):
;   PhysClimbEdgeAboveEyes  how far over the eyes he took off from a platform's edge has to be for his left
;                           hand to catch it in the jump.
PhysClimbEdgeAboveEyes=10
; HYBRID only: how close under the lip his eyes are when the game takes the climb back and finishes it with
; its own animation. 0 = never, the hands finish it. (PHYSICAL shares the rule but never carries him without
; the hands, so in practice only HYBRID reaches it.)
PhysClimbHandOffUU=20
;  AutoLedgeGrab - 1: jump toward a ledge and Miles catches it by himself, like the original game
; (in the air your hands leave the edge to the game); then pull down with both grips or press A to climb up
; (in PHYSICAL climbing A only jumps, so the hands do it - see ClimbMode above), B to drop. 0 (default): in
; the air a hand takes the edge only when you squeeze its grip.
AutoLedgeGrab=1
;  BodyFollowsHead - 1 (default): turn your own body or chair and, once you have faced more than
; 20 degrees away for 2 seconds, Miles turns to face the same way. The view does not move; his arms and the
; hip holster line up with yours again, so you do not have to recenter for that. 0 = only a recenter does it.
BodyFollowsHead=1
BodyAlignSeconds=2.000
FreezeCameraRotation=0
; (Test48) Pushing the left stick with your left hand down at your hip or waist, squeezing the left grip is
; sprint - it does not grab the table or railing edge beside you. A raised hand still takes an edge, and a
; ladder rung is always taken. 0 = as before.
RunGripIgnoresLowEdges=1
; (Test43) CamcorderHold: 4 = free (default) - the camcorder in your hand moves and turns exactly with
; your controller, like a real one, its flip screen open toward you; 3 = GAME POSE: held upright in front
; of you with the lens ahead, the way Miles raises it (your hand still places it).
;  Hold the right stick click (about 0.8 s) to raise the camcorder with the game's own
; animation; it stays at his face with your hand resting. Hold it again, or squeeze the right grip at
; your face, to run the lower animation. A short click is still the night-vision switch.
; CamcorderLiveScreen: the flip-out screen shows what the lens sees (see below).
CamcorderHold=4
; (Test46) the live screen (the flip-out screen showing the lens's own picture) is off for now -
; experimental. 1 turns it on.
CamcorderLiveScreen=0
; (Test45) Where the camcorder sits in your hand (also in the in-game VR settings): CamcorderTilt / Turn /
; Roll in degrees, CamcorderForwardCM / UpCM / RightCM move your hand and the camcorder together. All 0:
; the lens points where your controller points.
CamcorderTilt=-85
CamcorderTurn=0
CamcorderRoll=0
CamcorderForwardCM=0
CamcorderUpCM=0
CamcorderRightCM=0
; (Test43) CoverMouth: a hand over your mouth holds Miles's breath while he breathes hard. (Test45) removed
; from the menus and off; 1 still turns it on (and installs the sound hooks it needs).
CoverMouth=0
; (Test44) RoomscaleWalk: walk around your room and Miles's body walks with you - the same steps, in the
; same frame, through the game's own collision (a wall or a shut door stops him as it stops the stick, and
; he steps up a low step). Small leans stay leans: only what goes past the body bounds walks. Only while he
; is on his feet in ordinary play (not on a ladder, climbing, in a locker or a scripted scene).
; 0 = the body stays put and only your head leans.
; Ships at 0 (off): turn it on if you want Miles to walk with you around your room.
RoomscaleWalk=0
; (Test46) ViewfinderFrame: 0 = when you zoom, the zoomed picture fills your view; 1 = the old framed
; camcorder window with black around it.
ViewfinderFrame=0

[Cinema]
; The main menu, startup logos and loading screens play on a screen in a pitch-black void, with a
; soft gradient of the picture's own edge colours hugging the screen. By default the screen follows
; your head, easing after it (it does not sit welded to your face: small head movements are ignored).
;   Environment  1 = the black void, 0 = the old flat backdrop
;   Curved       1 = a gently curved screen when the headset runtime supports it
;   HeadLocked   1 = the screen follows your head (default), 0 = stays put in the room
;   Preset       the shipped look this section was written for. An older value makes the mod rewrite
;                the section once with the current defaults (6 = small far screen, black void).
Environment=1
Curved=1
DistanceM=3.2
WidthDeg=56.0
HeadLocked=1
ScreenOffsetX=0.0
MenuGlow=0
Preset=6

[Comfort]
; Remove the game's own camera tilt during play. Your head still tilts freely.
LevelHorizon=1

[Menu]
; The settings menu opens by itself the first time the mod runs, so a new player
; finds out it exists. Set this back to 0 to make that happen again.
Introduced=1

[XR]
; Set this to 0 to run the game flat on the monitor with the mod loaded but no
; headset involved.
Enabled=1

; Submit at the OpenXR runtime's recommended per-eye resolution. The game image is enlarged with
; a controlled sharp upscale instead of asking the headset compositor to stretch 960x1080 itself.
NativeEyeResolution=1
Sharpness=0.000

; 1 = bicubic enlargement with adaptive sharpening (sharper). 0 = the Test 28 bilinear path.
Upscaler=2
SubmitThread=1
FitRuntimeFrustum=1
; FORMAT . 1 = ask the headset's own runtime which eye-image format it offers and use
; one it actually lists (the shipped BGRA8 with an sRGB transfer, or the byte-identical version
; without one if that is all it has). A format the runtime does not offer costs it a conversion
; pass on every eye every frame. 0 = always ask for the shipped format, the pre-1.2.1 behaviour.
; The log line "[OLVR][SWAPFMT]" says what your runtime offers and what was chosen.
RuntimeFormat=1
; (Test47) The game's textures keep a copy in ordinary memory, the way the original game's own D3D9 did, so
; loading a new area no longer stalls the game - measured on a walk through the admin block: 136 freezes of
; up to 0.6 s became none. Uses about as much RAM as the original game. 0 = the earlier way.
TextureShadow=1

; SMOOTHNESS (Test 36). D3D9Ex=1 runs the game on the extended D3D9 device, which can share its
; frames with the headset on the graphics card at the game's normal D3D9 speed. Measured on this
; laptop at the asylum gate: 74 fps (Test 35's D3D9On12 layer: 46). If the game ever draws wrongly
; or crashes with it, set D3D9Ex=0 - the Test 35 path (D3D9On12 + ZeroCopy) takes over.
D3D9Ex=1
; SMOOTHNESS (Test 35). D3D9On12=1 runs the game on Windows' D3D9-on-D3D12 layer, which lets
; ZeroCopy=1 hand each frame to the headset on the graphics card. Only used when D3D9Ex=0.
D3D9On12=1
ZeroCopy=1
; Fallback copy path: picks up each frame a moment later instead of waiting for it.
AsyncReadback=1
; One game frame per headset frame when the game is faster than the headset.
PaceToHeadset=1
; JITTER (Test 36). Every frame goes to the headset tagged with the exact head pose it was drawn
; with (the game draws on one thread and presents on another; Test 35 tagged each frame with the
; NEXT frame's pose, so the picture shook while you turned your head). 0 = the Test 35 behaviour.
FramePoseLatch=1

[Stream]
; STREAMING . Everything in this section is about the picture the headset's own
; compositor builds between the frames this PC sends - the part that shows up as black bars at
; the edges of your view when you turn your head quickly. See docs/VR-RUNTIMES.md.

; 1 = fill the margin around the picture inside the eye image with the picture's own edge instead
; of black. Quest Link / Air Link (and anything else that composites the frame into its own lens
; frustum) has a strip the game never rendered; when the headset warps the frame for a fast head
; turn, that strip is what appears as a black bar. Stretched edge pixels look like the world
; continuing, so the bar is gone. 0 = the old black margin. Cost: none, it is the same blit.
; A picture that covers less than three quarters of the eye ON THAT AXIS (a menu, a narrow scripted
; camera) keeps its black field on that axis - stretching that far would be a smear, not overscan.
EdgeFill=1

; [OVERSCAN]  How many DEGREES of picture to render BEYOND the lens on every
; edge. This is the other half of the black-bar problem, and the one EdgeFill above cannot reach: on
; a runtime that honours the declared FOV (SteamVR, Virtual Desktop) the picture IS the eye image, so
; there is no spare margin at all for the compositor's reprojection to pull from - the first degree
; of unexpected head motion is already black. Rendering wider and declaring the wider frustum gives
; the warp real pixels; the lens still sees exactly the angles it always did.
; 0 = off (the old frustum, byte for byte). 2-4 is the useful range. Cost is sharpness: the same
; pixel budget spread over more degrees, i.e. exactly what LensFit bought is partly given back.
; Sharper + black edges, or softer + no black edges: that is the trade this number makes.
EdgeOverscanDeg=2.0

; How many display refreshes ahead of the headset's own timing the head pose is predicted.
; 1 = the shipped behaviour and right for a headset that keeps up. 0 = no
; lead at all - use it to A/B a "the world lags behind my head" report.
PoseLeadPeriods=1

[Perf]
; ============================================================================
; OPTIMIZATION SWITCHES .
; Every one of these is a *work-avoidance* switch: the default (1, or the time
; budget in microseconds) is the optimized path, and 0 restores exactly what the
; previous build did. They exist so a stutter report can be bisected by hand
; without reinstalling anything, and so a future change can be A/B'd.
;
; What each one removes, in one line - the full story is in the [PERF-*] comment
; blocks in src/ and in docs/PERFORMANCE.md:
;   DrawFastFlags    3 cross-module calls per DRAW CALL (thousands a frame)
;   BackBufferCache  one GetBackBuffer COM call per render-target change
;   SkelFastGate     the arm solver's full gate for every skeletal prop in the level
;   FovCache         the camera-angle maths repeated by every FOV query in a frame
;   NvLightCache     re-identifying the night-vision lights on every SetRotation
;   HudSmart         a 1.2 MB camcorder-HUD upload on frames whose readouts did not move
;   ObjScanBudgetUs  how long one slice of the door/ledge/ladder object scan may take
;   TimerResolution  Sleep(1) rounding to ~15.6 ms (the Windows 10 2004 per-process timer)
;   ThreadPriority   the XR worker waking late / being parked in the EcoQoS class
;   PaceWait         the render thread spinning for the last 1.5 ms of the pacing budget
;   BridgeMirror     the two full-frame StretchRects + windowed Present on the render thread
;   SharedFrameDirect the 36 MB copy of the game's shared frame into the bridge's own texture
;   ViewCache        one ID3D11 view per texture instead of a view created per blit
;   DirectSwapchain  the blit's scratch image + CopyResource into the swapchain (OFF: opt-in)
; Phase 5 (visibility) adds:
;   OcclPerEye       the game's occlusion culling, thrown away by OcclForce/OcclusionSkip (ships 0)
;   OcclHold         one frame of GPU noise can no longer blink a prop out (used with OcclPerEye)
;   OcclProve        a "culled" must be this eye's own, unre-issued answer (used with OcclPerEye)
;   OcclGuard        the same proof+hold on the ENGINE's own reads (phase 5.2; used with OcclForce=0)
;   PvsShare         the second eye's precomputed-visibility lookup (it reuses the first eye's; ships 0)
;   VisReuse         the second eye's occlusion boxes + verdicts (OFF: needs UnionFrustum, not OcclPerEye)
;   UnionFrustum     one frustum for both eyes instead of one each (OFF: costs picture margin)
; ============================================================================

; The draw wrappers ask "is stereo live", "is OcclForce on" and "is the split live" once per draw.
; 1 = asked once per Present instead (a frame-stable snapshot; see [PERF-A4]).
DrawFastFlags=1
; 1 = the backbuffer surface is cached and compared by pointer instead of re-fetched with a COM
; call on every render-target change (see [PERF-A5]).
BackBufferCache=1
; 1 = only Miles's own skeletal component runs the arm solver's gate; the rest of the level leaves
; after one pointer compare. The three global restores still run, once a frame (see [PERF-D1]).
SkelFastGate=1
; 1 = the camera angle the mod writes is computed once per frame per distinct input, not once per
; engine query (camera + aim + HUD + one per eye; see [PERF-D3]).
FovCache=1
; 1 = the night-vision light components are identified once and remembered (see [PERF-D4]).
NvLightCache=1
; 1 = the camcorder HUD readout band is redrawn and uploaded only when a readout changed
; (see [PERF-A6]).
HudSmart=1

; The door / ledge / ladder scan walks the engine's object table a slice a frame. This is how long
; one slice may spend, in microseconds; the pass simply continues on the next frame. 0 = the old
; fixed slice of 4000 objects a frame (see [PERF-A7]).
ObjScanBudgetUs=250

; [PERF-A1] Timer and scheduling .
; 1 = ask Windows for a 1 ms timer for this process. Since Windows 10 2004 the timer resolution
; is per process: without this, Sleep(1) can sleep ~15.6 ms and the pacing wait misses a whole
; display interval. 0 = the old default tick.
TimerResolution=1
; 1 = the XR worker runs at THREAD_PRIORITY_TIME_CRITICAL and opts out of EcoQoS. The worker
; owns every xrWaitFrame, so its wake-up jitter is the compositor's. 0 = normal priority.
ThreadPriority=1
; 1 = raise the whole game process to ABOVE_NORMAL. Off by default: it affects the game's own
; threads too, and the worker boost above is what pays. A/B it only if the game starves the worker.
ProcessPriority=0

; [PERF-A2] 1 = the render thread blocks in WaitOnAddress until the bridge consumes the frame,
; instead of spinning (YieldProcessor) in the last 1.5 ms of the budget. 0 = the old spin.
PaceWait=1

; [PERF-A8] 1 = the D3D11 worker draws the one-eye monitor picture on its own swap chain and
; presents it off the game's render thread; the render thread then skips both the two StretchRect
; calls and the windowed Present while stereo is live. 0 = the old render-thread mirror. If the
; bridge cannot present (not windowed, swap chain refused, headset asleep) the old path returns
; automatically (400 ms, or two monitor intervals at a very low DesktopMirrorFps).
BridgeMirror=1

; [PERF-A3] Shared frames .
; 1 = the bridge samples the game's shared frame WHERE IT IS instead of copying it into its own
; upload texture first. That copy is 36 MB a frame (~2.6 GB/s at 72 fps) for nothing: the shared frame
; already has the format and the size the eye blit reads, and the slot it comes from is not handed
; back until that frame's draws have been queued. A GPU or runtime that refuses a view on a shared
; frame falls back to the copy by itself (one line in the log says so).
; It ships ON; set 0 to restore exactly the 1.2.2 frame path (the copy, the old blits, nothing new
; on the GPU) so a picture problem can be bisected with one key instead of a rebuild.
SharedFrameDirect=1

; [PERF-A3] 1 = one ID3D11 view per texture, kept (and dropped on every swapchain rebuild); 0 = a view
; created and released per blit, which is what the pre-1.2.2 code did. Same picture either way: this is
; the switch that tells a view-cache problem apart from anything else without a rebuild.
ViewCache=1

; [PERF-B8] Direct draw into the swapchain image . OFF BY DEFAULT.
; 1 = the eye blit's shader draws straight into the acquired OpenXR swapchain image, removing the
; second 36 MB a frame (the scratch image + CopyResource). The view format and the colour space are
; taken from the image itself, which is the part the earlier direct-render attempt got wrong (a
; typeless image needs an explicit format, and an sRGB view over UNORM bytes is one gamma step off);
; any refusal from the driver drops that frame back to the scratch draw + copy.
; LEAVE IT AT 0 unless you are testing it: the copy path is the byte-for-byte proven one.
DirectSwapchain=0

; ============================================================================
; PHASE 5 - VISIBILITY .
; The game decides what to draw with two per-frame machines: hardware occlusion queries (it draws a
; test box, asks the GPU how many pixels passed, and culls meshes whose last answer was 0) and the
; baked precomputed visibility ("PVS": the view's position picks a cell, and the cell says which
; static meshes exist from there). Both were built for ONE picture per frame; VR makes two, and the
; two views were fighting over the same answers. OcclForce=1 solved that by throwing the culling
; away. These four keys are the proper fix, one part each.
; ============================================================================

; [OCCLPEREYE] (B1) 1 = every occlusion query keeps one real answer PER EYE, and a read never waits:
; a query the GPU has not finished answers with this eye's previous frame, which is the age the
; game's own culling is built around anyway. This is what gives the culling back - while it is on,
; OcclForce's force-visible and OcclusionSkip's box skipping stand down by themselves (the boxes ARE
; the query's pixels; skipping them would answer "nothing visible" and objects would disappear).
; 0 = the 1.2.2 behaviour, where OcclForce/OcclusionSkip own the queries.
;
; SHIPS 0. The first session with it on (2026-11-05) reported props blinking in front of the player.
; That blink is now answered in code: [Perf] OcclProve=1 (below) refuses any "culled" that cannot be
; proven to describe the box the engine just drew - the two views (or a recycled pool slot) put
; another box's answer in the same query object, and that answer used to hide a prop that was right
; in front of the player - and OcclHold=1 needs two zeros in a row on top of that. To A/B it: set 1
; here, keep OcclProve=1 and OcclHold=1, play a heavy area, and read the [PERF] "occl per-eye" line
; (verdict changes per eye, how many culls were held, and how many could not be proven). If the
; picture is clean, leave it on; if anything still blinks, send the log - the "unproven" count says
; whether the two views are sharing query objects (then there is no culling to win, keep this at 0).
;
; NOTE (phase 5.2): this is NOT needed for [VISREUSE], [UNIONFRUSTUM] or [PVSSHARE]. See the
; "PHASE 5.2" block below for the configuration that turns the culling back on without it.
OcclPerEye=0

; [OCCLHOLD] (B1) 1 = a prop needs TWO consecutive "culled" answers before it disappears, so no
; single frame of GPU noise can blink it out; "visible" is always believed at once (a wrong
; "visible" only costs pixels, a wrong "culled" makes a prop vanish). Only used with OcclPerEye=1.
; 0 = a single "culled" is enough, which is the honest A/B for the stabiliser itself.
OcclHold=1

; [OCCLPROVE] (B1) 1 = a "culled" is only believed when the value provably describes the box the
; engine just drew: it came from THIS eye's box, and the query object was not opened again since its
; value was last read. That second part is the 2026-11-05 blink: one D3D9 query holds ONE result,
; and the other view (or the next primitive, with a pooled/recycled handle) overwrites it before
; anybody reads it, so a "0 pixels" that belongs to another box used to cull a prop in front of the
; player. Everything unproven is reported as "lots of pixels", like OcclForce does - the box still
; costs its draw, the prop stays.
; 0 = pass the GPU verdicts on raw (the pre-fix phase-5 shape). Only useful to reproduce the blink.
OcclProve=1

; [OCCLGUARD] (phase 5.2) 1 = the same proof and the same two-zeros rule, applied to the ENGINE's own
; occlusion reads instead of a per-eye table. The engine keeps drawing its test boxes and waiting
; exactly as it always did; the only change is that a "culled" that cannot be proven to be this box's,
; or that did not happen twice in a row, is reported to the engine as "visible". A wrong answer can
; therefore only cost pixels, never a prop - which is what makes OcclForce=0 safe to try WITHOUT
; re-enabling [OCCLPEREYE] (the mechanism that blinked on 2026-11-05).
; It is inert while OcclForce=1 (the shipped default), so leaving it at 1 changes nothing today.
; 0 = the engine's raw verdicts, the old OcclForce=0 behaviour.
OcclGuard=1

; [PVSSHARE] (B2) 1 = the second eye reuses the first eye's precomputed-visibility answer for the
; same lookup instead of asking the engine again. The eyes are 6 cm apart, so they normally land in
; the same cell - and when they do not, sharing is what stops the two views from disagreeing about a
; mesh. 0 = both eyes ask, the way 1.2.2 did.
; INDEPENDENT of [OCCLPEREYE] and of OcclForce: it touches the engine's precomputed visibility, not
; the occlusion queries. Ships OFF (it was one of the two changes in play in the 2026-11-05 report);
; phase 5.2 recommends turning it ON - see the block at the end of this section.
PvsShare=0

; [VISREUSE] (C1) 1 = the SECOND eye stops drawing its own occlusion test boxes and takes the first
; eye's verdicts, in call order. That is only sound when both views cull the same world, so it does
; nothing unless [Perf] UnionFrustum=1; the boot line says which of the two states it is in.
; INDEPENDENT of [OCCLPEREYE] since phase 5.2: it needs the union frustum (C2), not the per-eye table.
; It does need occlusion culling to be live to pay - with OcclForce=1 the boxes are already skipped
; and every verdict is already "visible", so this switch has nothing left to save.
; OFF by default: it changes what the second eye is told and needs a session before shipping on.
VisReuse=0

; [UNIONFRUSTUM] (C2) 1 = both eyes are built with ONE frustum: the union of the two lenses, widened
; by the stereo offset. Both views then cull the same world, which is what makes VisReuse sound and
; what removes per-eye visibility disagreements at the source. The blit crops the wider picture back
; onto each eye's own lens, so the geometry you see does not change - but each eye gets its lens out
; of a bigger image, so part of the sharpness LensFit bought is given back.
; INDEPENDENT of every other phase-5 key: it is a frustum choice only, and it never touches a query.
; OFF by default, and it costs GPU: turn it on to A/B it, together with VisReuse=1.
UnionFrustum=0

; [UNIONFRUSTUM] How near, in game units, the stereo offset has to be covered by the union above.
; 100 units = 1 m (the game runs at 100 units per metre). Smaller = a narrower, sharper, faster
; frustum that can cull a near object in one eye; larger = wider, safer, softer.
UnionNearUU=10

; ----------------------------------------------------------------------------
; PHASE 5.2 - THE VISIBILITY PROFILE THAT DOES NOT NEED [OCCLPEREYE]
;
; Everything above is one mechanism each, and the dependency audit says only ONE of them ever needed
; the per-eye table: [VISREUSE] was wired inside it. Phase 5.2 makes it independent, so the culling
; can come back through a path that was never implicated in the 2026-11-05 blink:
;
;   [Stage3]  OcclForce=0        <- the real change: the engine culls again
;   [Render]  OcclusionSkip=0    <- the boxes must be drawn; they ARE the answer
;   [Perf]    OcclGuard=1        <- prove + hold on the engine's own reads (the safety net)
;   [Perf]    UnionFrustum=1     <- both eyes cull the same world (needed by VisReuse)
;   [Perf]    VisReuse=1         <- the second eye keeps one set of verdicts, costs no boxes
;   [Perf]    PvsShare=1         <- the second eye's PVS comes from the first (independent)
;   [Perf]    OcclPerEye=0       <- stays OFF: the mechanism that blinked is not used at all
;   [Perf]    OcclProve=1, OcclHold=1  <- the protections, now applied by OcclGuard
;
; Read the [PERF] line after a session: "occl per-eye: ... reused N" proves VisReuse is serving,
; "held N" proves the guard refused culls, "pvs shared N" proves PVS sharing, and "unproven N"
; must stay low (a high count means the second eye is asking for answers nobody recorded).
; If the picture is clean here, the only thing [OCCLPEREYE]=1 can add is the per-eye answer table
; itself - try it last, on its own, with OcclGuard left ON.
; ----------------------------------------------------------------------------

; [B9] (phase 7) 1 = the two eyes' draw lists are fingerprinted and compared every frame, and the
; match rate is printed in the [PERF] line ("draw lists: N/M identical"). This is the measurement
; "reuse the first eye's draws in the second" stands on: if the two passes are not the same sequence
; of the same things, nothing may be reused, and the number says so before any code is written.
; OFF by default because it costs two multiplies per draw call, thousands of times a frame.
DrawFingerprint=0


; ============================================================================
; PHASE 6 - CONTENT .
; Everything above cuts cost the MOD pays. This section cuts cost the GAME pays, by turning down
; things it renders that a two-view frame cannot afford - detail props, particles, dynamic shadows,
; far decoration, decals. None of it is a patch or an offset: each line is a UE3 system setting the
; engine already understands, run through the game's own console exactly as the developer would type
; it (`scale set <System> <Value>`). A wrong name fails loudly in the log instead of corrupting the
; picture, and turning the profile off replays the same commands with the original values.
;
; It is OFF by default. It is a content trade: props disappear, shadows go flat, particles thin out.
; The profile is judged on a headset, exactly like every other phase.
;
; [Perf] phase-6 knobs (runtime behaviour) live in the [Perf] section above; the profile itself is
; here because it is content, not a synchronization or memory switch.
; ============================================================================

[Content]

; 0 = off (the shipped picture), 1 = performance, 2 = performance+ (the heavier list).
; Applied once gameplay is live and re-applied after every level load, because a level load
; re-creates the world and some system settings go with it.
Profile=0

; The performance list, semicolon-separated (an ini value cannot hold a newline). Each entry is a
; full console line. Order matters only where a later line overrides an earlier one.
;
;   scale set DetailMode 1            <- D.5: High-detail props stop rendering in a two-view frame.
;                                        THE lever that cuts processed primitives AND draw calls.
;   scale set ParticleLODBias 2       <- D.4: particles are ~3x a mesh draw; raise their LOD bias.
;   scale set DynamicShadows False    <- the +6% the project baseline measured.
;   scale set MaxDrawDistanceScale 0.6 <- cull far decoration (draw calls, not processed primitives).
;   scale set Decals False            <- decal draws are per-view work.
Commands1=scale set DetailMode 1; scale set ParticleLODBias 2; scale set MaxDrawDistanceScale 0.6

; The performance+ list: everything above, plus the two that the picture really notices.
Commands2=scale set DetailMode 1; scale set ParticleLODBias 2; scale set MaxDrawDistanceScale 0.5; scale set DynamicShadows False; scale set Decals False

; Played back when the profile is turned OFF (or when the launcher writes FULL DETAIL), so the
; engine's own settings return to the values named here. These are the game's OWN defaults - change
; them only if a line above was changed to something other than the numbers below.
Restore=scale set DetailMode 0; scale set ParticleLODBias 1; scale set MaxDrawDistanceScale 1; scale set DynamicShadows True; scale set Decals True

; PLAYER-VISIBLE COST. Keep these comments next to the launch button:
;   DetailMode 1        vegetation, papers, debris and decoration disappear. The asylum gets emptier.
;   DynamicShadows off  shadows stop updating: the scene flattens, and lamps stop casting.
;   MaxDrawDistance 0.6 rooms beyond it pop in when you walk close.
;   Decals off          blood, posters, grime and bullet marks on walls vanish.

